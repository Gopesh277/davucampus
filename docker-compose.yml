services:
  db:
    image: postgres:16-alpine
    restart: always
    environment: {POSTGRES_USER: tt, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: tt}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U tt"], interval: 5s, retries: 10}
  app:
    build: .
    restart: always
    depends_on: {db: {condition: service_healthy}}
    environment:
      ENV: prod
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URL: "postgresql+psycopg2://tt:${DB_PASSWORD}@db/tt"
      WORKERS: "4"
  nginx:
    image: nginx:alpine
    restart: always
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
volumes: {pgdata: {}}
