# Production: cp .env.example .env, fill it in, put fullchain.pem + privkey.pem in ./certs, then
#   docker compose --env-file .env up -d --build
# Every secret below is required: compose refuses to start if one is missing.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: tt
      POSTGRES_DB: tt
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U tt"], interval: 5s, retries: 10}
    logging: *logging

  app:
    build: .
    restart: always
    depends_on: {db: {condition: service_healthy}}
    environment:
      ENV: prod
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      DEAN_USERNAME: "${DEAN_USERNAME:-dean}"
      DEAN_PASSWORD: "${DEAN_PASSWORD:?set DEAN_PASSWORD in .env}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}"
      DATABASE_URL: "postgresql+psycopg2://tt:${DB_PASSWORD}@db/tt"
      APP_TZ: "${APP_TZ:-Asia/Kolkata}"
      WORKERS: "${WORKERS:-4}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]   # fullchain.pem + privkey.pem
    depends_on: {app: {condition: service_healthy}}
    logging: *logging

volumes: {pgdata: {}}
