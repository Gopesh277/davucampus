# Campuses share one public IP behind NAT, so the login limit is generous per IP (the app also throttles per account).
limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
upstream api { server app:8000; keepalive 32; }

# Plain HTTP only redirects: passwords and session tokens never cross the network unencrypted.
server {
  listen 80;
  server_tokens off;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_tokens off;
  http2 on;
  # Put your certificate in ./certs (see README): fullchain.pem + privkey.pem
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 12m; gzip on; gzip_types application/json text/css application/javascript;
  location = /api/login { limit_req zone=login burst=100 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  location / { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; proxy_set_header Connection ""; }
}
