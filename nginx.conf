# Campuses share one public IP behind NAT, so the login limit is generous per IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
upstream api { server app:8000; keepalive 32; }
server {
  listen 80; client_max_body_size 12m; gzip on; gzip_types application/json text/css application/javascript;
  location = /api/login { limit_req zone=login burst=100 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_http_version 1.1; proxy_set_header Connection ""; }
}
